

services:
  # Contenedor 1: Nuestra aplicación de Next.js
  nextjs_app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    # 🚀 TRUCO DE DESARROLLO: Fuerza el modo desarrollo y conecta tus archivos locales
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  # Contenedor 2: El servidor Nginx
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8080:80" # Abre el puerto 80 estándar de internet en tu compu
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nextjs_app