services:
  # Contenedor 1: Nuestra aplicación de Next.js
  nextjs_app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production

  nextjs_app_dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
      
  # Contenedor 2: El servidor Nginx (único punto de acceso externo)
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8080:80" # Solo Nginx escucha peticiones desde tu máquina/host
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nextjs_app