services:
  # Contenedor 1: Nuestra aplicación de Next.js
  nextjs_app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production

  # Contenedor 2: El servidor Nginx (único punto de acceso externo)
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8080:80" # Solo Nginx escucha peticiones desde tu máquina/host
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nextjs_app